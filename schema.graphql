schema {
  query: Query
  mutation: Mutation
}

type Customer {
  id: Int!
  name: String!
  email: String!
}

type Invoice {
  "Money kept on the invoice: payments minus refunds."
  paidCents: Long!
  "What the customer still owes."
  outstandingCents: Long!
  id: Int!
  customerId: Int!
  customerName: String!
  description: String!
  totalCents: Long!
  status: InvoiceStatus!
  createdAt: DateTime!
  payments: [Payment!]!
}

type Mutation {
  createCustomer(name: String! email: String!): Customer!
  createInvoice(customerId: Int! totalCents: Long! description: String!): Invoice!
  voidInvoice(invoiceId: Int!): Invoice!
  "Pays part or all of an invoice. Send the same idempotencyKey on a retry and the customer is only charged once."
  recordPayment(invoiceId: Int! amountCents: Long! idempotencyKey: String): Invoice!
  refundPayment(paymentId: Int! amountCents: Long! reason: String!): Refund!
}

type Payment {
  id: Int!
  amountCents: Long!
  refundedCents: Long!
  createdAt: DateTime!
}

type Query {
  customers: [Customer!]!
  invoices: [Invoice!]!
  invoice(id: Int!): Invoice!
}

type Refund {
  id: Int!
  paymentId: Int!
  amountCents: Long!
  reason: String!
  createdAt: DateTime!
}

enum InvoiceStatus {
  OPEN
  PARTIALLY_PAID
  PAID
  VOID
}

"The `DateTime` scalar represents an ISO-8601 compliant date time type."
scalar DateTime @specifiedBy(url: "https:\/\/www.graphql-scalars.com\/date-time")

"The `Long` scalar type represents non-fractional signed whole 64-bit numeric values. Long can represent values between -(2^63) and 2^63 - 1."
scalar Long