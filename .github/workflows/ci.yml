# Runs on every pull request and every push to main, so a PR shows a green
# check (or a red X) before it gets merged.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: .NET build and xUnit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal
